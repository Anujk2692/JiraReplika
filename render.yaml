services:
  # Spring Boot Java 17 Backend Service
  - type: web
    name: jira-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: jiradb
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jiradb
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jiradb
          property: database
      - key: DB_USER
        fromDatabase:
          name: jiradb
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jiradb
          property: password
      - key: JWT_SECRET
        generateValue: true

  # React 18 Web Frontend
  - type: web
    name: jira-web
    env: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: jiradb
    databaseName: jiradb
    user: jira_user
    plan: free
